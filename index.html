<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nisha Kumari — AI & ML Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
/* ─── CSS VARIABLES ─────────────────────────────────── */
:root {
  --bg: #050508;
  --bg2: #0a0a12;
  --surface: #0d0d1a;
  --border: rgba(255,255,255,0.07);
  --border-bright: rgba(99,102,241,0.4);
  --text: #f0f0ff;
  --muted: #6b7280;
  --accent: #6366f1;
  --accent2: #06b6d4;
  --green: #00ff88;
  --neon-purple: #a855f7;
  --neon-pink: #ec4899;
  --font-mono: 'Space Mono', monospace;
  --font-sans: 'Inter', sans-serif;
  --glow: 0 0 40px rgba(99,102,241,0.3);
  --glow2: 0 0 40px rgba(6,182,212,0.3);
  --glow-green: 0 0 20px rgba(0,255,136,0.4);
  --radius: 16px;
  --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f8f8ff;
  --bg2: #f0f0fa;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-bright: rgba(99,102,241,0.3);
  --text: #0f0f1a;
  --muted: #64748b;
  --green: #059669;
  --glow: 0 4px 24px rgba(99,102,241,0.15);
}

/* ─── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  cursor: none;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
button { cursor: none; }

/* ─── CUSTOM CURSOR ─────────────────────────────────── */
#cursor-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  transition: transform 0.1s;
  mix-blend-mode: difference;
}
#cursor-ring {
  width: 36px; height: 36px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9998;
  transition: transform 0.12s ease, width 0.2s, height 0.2s, opacity 0.2s;
  mix-blend-mode: difference;
}
#cursor-ring.expand { width: 60px; height: 60px; opacity: 0.5; }

/* ─── CANVAS BACKGROUND ─────────────────────────────── */
#bg-canvas {
  position: fixed; inset: 0;
  z-index: 0; pointer-events: none;
  opacity: 0.6;
}

/* ─── SCROLLBAR ─────────────────────────────────────── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

/* ─── NAVBAR ─────────────────────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 5%;
  background: rgba(5,5,8,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: background 0.3s;
}
[data-theme="light"] nav { background: rgba(248,248,255,0.85); }
.nav-logo {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  color: var(--green);
  letter-spacing: 2px;
}
.nav-logo span { color: var(--muted); }
.nav-links { display: flex; gap: 36px; list-style: none; }
.nav-links a {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -4px; left: 0;
  width: 0; height: 1px; background: var(--green);
  transition: width 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--green); }
.nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
.nav-right { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 38px; height: 38px;
  border-radius: 50%; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, transform 0.2s;
  cursor: none;
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none;
}
.hamburger span {
  display: block; width: 24px; height: 2px;
  background: var(--text); transition: 0.3s;
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
.mobile-nav {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(5,5,8,0.97); backdrop-filter: blur(20px);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 40px;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-family: var(--font-mono); font-size: 2rem;
  color: var(--text); letter-spacing: 4px; text-transform: uppercase;
  transition: color 0.2s;
}
.mobile-nav a:hover { color: var(--green); }

/* ─── HERO ───────────────────────────────────────────── */
#hero {
  min-height: 100vh; position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: flex-start; justify-content: center;
  padding: 0 8%;
  overflow: hidden;
}
.hero-tag {
  font-family: var(--font-mono);
  font-size: 0.8rem; color: var(--green);
  letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
  opacity: 0; animation: fadeUp 0.6s 0.3s forwards;
}
.hero-tag::before {
  content: ''; display: block;
  width: 40px; height: 1px; background: var(--green);
}
.hero-name {
  font-size: clamp(3.5rem, 9vw, 8rem);
  font-weight: 900; line-height: 0.95;
  letter-spacing: -3px;
  opacity: 0; animation: fadeUp 0.7s 0.5s forwards;
}
.hero-name .line2 {
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--neon-purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-subtitle {
  font-family: var(--font-mono); font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: var(--muted); margin-top: 24px; max-width: 520px;
  line-height: 1.7;
  opacity: 0; animation: fadeUp 0.7s 0.7s forwards;
}
.hero-subtitle .type-cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: var(--green); margin-left: 3px;
  vertical-align: middle; animation: blink 1s infinite;
}
.hero-cta {
  display: flex; gap: 16px; margin-top: 40px; flex-wrap: wrap;
  opacity: 0; animation: fadeUp 0.7s 0.9s forwards;
}
.btn-primary {
  padding: 14px 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: 4px;
  font-family: var(--font-mono); font-size: 0.85rem;
  letter-spacing: 1px; text-transform: uppercase;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: none;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: var(--glow); }
.btn-outline {
  padding: 14px 32px;
  background: transparent;
  color: var(--text); border: 1px solid var(--border-bright);
  border-radius: 4px;
  font-family: var(--font-mono); font-size: 0.85rem;
  letter-spacing: 1px; text-transform: uppercase;
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
  cursor: none;
}
.btn-outline:hover { border-color: var(--green); color: var(--green); transform: translateY(-3px); }
.hero-stats {
  display: flex; gap: 48px; margin-top: 64px;
  opacity: 0; animation: fadeUp 0.7s 1.1s forwards;
}
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat-num {
  font-size: 2.2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--green), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label {
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
}
.hero-scroll {
  position: absolute; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  opacity: 0; animation: fadeIn 1s 1.5s forwards;
}
.hero-scroll span {
  font-family: var(--font-mono); font-size: 0.65rem;
  color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
}
.scroll-line {
  width: 1px; height: 60px; background: linear-gradient(to bottom, var(--accent), transparent);
  animation: scrollLine 2s ease infinite;
}

/* ─── SECTION BASE ───────────────────────────────────── */
section {
  position: relative; z-index: 1;
  padding: 120px 8%;
}
.section-label {
  font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--green); letter-spacing: 4px; text-transform: uppercase;
  margin-bottom: 12px; display: flex; align-items: center; gap: 12px;
}
.section-label::after {
  content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--green);
}
.section-title {
  font-size: clamp(2.2rem, 5vw, 4rem);
  font-weight: 900; letter-spacing: -1.5px;
  line-height: 1.05; margin-bottom: 60px;
}
.section-title .hl {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ─── REVEAL ANIMATION ───────────────────────────────── */
.reveal {
  opacity: 0; transform: translateY(40px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out !important;
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-left {
  opacity: 0; transform: translateX(-40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-left.visible { opacity: 1; transform: translateX(0); }
.reveal-right {
  opacity: 0; transform: translateX(40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-right.visible { opacity: 1; transform: translateX(0); }

/* ─── ABOUT ──────────────────────────────────────────── */
#about { background: var(--bg2); }
.about-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px; align-items: start;
}
.about-bio {
  font-size: 1.05rem; color: var(--muted);
  line-height: 1.9; margin-bottom: 32px;
}
.about-bio strong { color: var(--text); }
.terminal-card {
  background: #0a0a12;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--glow);
}
[data-theme="light"] .terminal-card { background: #f0f0fa; }
.terminal-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
}
.tdot {
  width: 12px; height: 12px; border-radius: 50%;
}
.tdot.red { background: #ff5f57; }
.tdot.yellow { background: #ffbd2e; }
.tdot.green { background: #28ca41; }
.terminal-title {
  font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--muted); margin-left: 8px;
}
.terminal-body { padding: 24px; font-family: var(--font-mono); font-size: 0.82rem; line-height: 2; }
.t-line { display: flex; gap: 10px; }
.t-prompt { color: var(--green); }
.t-cmd { color: var(--accent2); }
.t-val { color: var(--text); }
.t-key { color: var(--neon-purple); }
.t-comment { color: var(--muted); }
.t-string { color: #fbbf24; }
.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
.skill-group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px; transition: border-color 0.3s;
}
.skill-group:hover { border-color: var(--border-bright); }
.skill-group-title {
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--accent); letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: 12px;
}
.skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-family: var(--font-mono); font-size: 0.72rem;
  padding: 4px 10px; border-radius: 3px;
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.2);
  color: var(--accent2); letter-spacing: 0.5px;
  transition: background 0.2s, border-color 0.2s;
}
.tag:hover { background: rgba(99,102,241,0.2); border-color: var(--accent); }
.tag.green { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.2); color: var(--green); }
.tag.purple { background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.2); color: var(--neon-purple); }

/* ─── BENTO GRID (PROJECTS) ─────────────────────────── */
#projects { background: var(--bg); }
.bento-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: auto;
  gap: 16px;
}
.bento-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  position: relative; overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), 
              box-shadow 0.35s ease, 
              border-color 0.35s ease !important;
  cursor: none;
}
.bento-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(600px at var(--mx,50%) var(--my,50%), rgba(99,102,241,0.06), transparent 80%);
  opacity: 0; transition: opacity 0.4s; pointer-events: none;
}
.bento-card:hover::before { opacity: 1; }
.bento-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-8px) scale(1.015);
  box-shadow: 0 16px 35px rgba(0, 0, 0, 0.35);
}
.bento-card.span-4 { grid-column: span 4; }
.bento-card.span-2 { grid-column: span 2; }
.bento-card.span-3 { grid-column: span 3; }
